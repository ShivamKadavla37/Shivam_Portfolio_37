
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shivam Portfolio - Hero</title>
    <link rel="stylesheet" href="hero.css">
</head>
<body>
    <div class="hero-container">
        <!-- Animated Background Elements -->
        <div class="background-elements">
            <!-- Grid Pattern -->
            <div class="grid-pattern"></div>
            
            <!-- Floating Icons -->
            <div class="floating-icon icon-1">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16,18 22,12 16,6"></polyline>
                    <polyline points="8,6 2,12 8,18"></polyline>
                </svg>
            </div>
            <div class="floating-icon icon-2">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                    <path d="M12 2v20"></path>
                    <path d="M5 12l14 0"></path>
                </svg>
            </div>
            <div class="floating-icon icon-3">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                    <rect x="9" y="9" width="6" height="6"></rect>
                </svg>
            </div>
            <div class="floating-icon icon-4">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 12l2 2 4-4"></path>
                    <path d="M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.745 3.745 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.745 3.745 0 0 1 3.296-1.043A3.745 3.745 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.745 3.745 0 0 1 3.296 1.043 3.745 3.745 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12z"></path>
                </svg>
            </div>

            <!-- Glowing Orbs -->
            <div class="glowing-orb orb-1"></div>
            <div class="glowing-orb orb-2"></div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Profile Photo -->
            <div class="profile-photo">
                <img src="/lovable-uploads/34a2b5da-d45f-4f0b-b0d4-098a64cbb164.png" alt="Shivam Kadavla" class="profile-image">
                <div class="profile-ring ring-1"></div>
                <div class="profile-ring ring-2"></div>
            </div>

            <!-- Name and Title -->
            <div class="content-section">
                <h1 class="main-title">
                    <span class="gradient-text">Shivam Kadavla</span>
                </h1>
                
                <div class="typing-container">
                    <p class="typing-text">
                        <span id="typed-text"></span>
                        <span class="cursor">|</span>
                    </p>
                </div>
            </div>

            <!-- Description -->
            <p class="description">
                Crafting innovative solutions with cutting-edge technology. 
                Passionate about AI, full-stack development, and creating 
                digital experiences that make a difference.
            </p>

            <!-- CTA Buttons -->
            <div class="cta-buttons">
                <button class="btn btn-primary">View My Work</button>
                <button class="btn btn-outline">Download Resume</button>
            </div>

            <!-- Scroll Indicator -->
            <div class="scroll-indicator">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6,9 12,15 18,9"></polyline>
                </svg>
            </div>
        </div>
    </div>

    <script src="hero.js"></script>
</body>
</html>
