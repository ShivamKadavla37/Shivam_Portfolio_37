
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Portfolio</title>
    <link rel="stylesheet" href="projects.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="projects-container">
        <!-- Floating Background Elements -->
        <div class="floating-elements">
            <div class="floating-circle floating-1"></div>
            <div class="floating-circle floating-2"></div>
            <div class="floating-circle floating-3"></div>
        </div>

        <div class="container">
            <div class="max-width-container">
                <!-- Section Header -->
                <div class="section-header animate-fade-in">
                    <h2 class="main-title">
                        <span class="gradient-text">Featured Projects</span>
                    </h2>
                    <div class="title-underline"></div>
                    <p class="section-description">
                        Showcasing innovative solutions and cutting-edge technologies
                    </p>
                </div>

                <!-- Projects Grid -->
                <div class="projects-grid" id="projectsGrid">
                    <!-- Projects will be generated by JavaScript -->
                </div>

                <!-- View All Projects Button -->
                <div class="view-all-section animate-fade-in" style="animation-delay: 0.8s;">
                    <button class="view-all-btn hover-scale" id="viewAllBtn">
                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 18 22 12 16 6"></polyline>
                            <polyline points="8 6 2 12 8 18"></polyline>
                        </svg>
                        <span class="btn-text">View All Projects</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="projects.js"></script>
</body>
</html>
