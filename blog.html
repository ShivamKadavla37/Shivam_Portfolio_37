
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Portfolio</title>
    <link rel="stylesheet" href="blog.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="blog-container">
        <!-- Floating Background Elements -->
        <div class="floating-elements">
            <div class="floating-circle floating-1"></div>
            <div class="floating-circle floating-2"></div>
            <div class="floating-circle floating-3"></div>
        </div>

        <div class="container">
            <div class="max-width-container">
                <!-- Section Header -->
                <div class="section-header animate-fade-in">
                    <h2 class="main-title">
                        <span class="gradient-text">Blog & Insights</span>
                    </h2>
                    <div class="title-underline"></div>
                    <p class="section-description">
                        Sharing knowledge, insights, and experiences from the world of software development
                    </p>
                </div>

                <!-- Category Filter -->
                <div class="category-filter animate-fade-in" style="animation-delay: 0.2s;" id="categoryFilter">
                    <!-- Category buttons will be generated by JavaScript -->
                </div>

                <!-- Featured Post -->
                <div class="featured-post-container animate-fade-in" style="animation-delay: 0.4s;" id="featuredPost">
                    <!-- Featured post will be generated by JavaScript -->
                </div>

                <!-- Blog Posts Grid -->
                <div class="blog-grid" id="blogGrid">
                    <!-- Blog posts will be generated by JavaScript -->
                </div>

                <!-- Load More Button -->
                <div class="load-more-container animate-fade-in" style="animation-delay: 0.8s;">
                    <button class="load-more-btn hover-scale" id="loadMoreBtn">
                        Load More Articles
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="blog.js"></script>
</body>
</html>
