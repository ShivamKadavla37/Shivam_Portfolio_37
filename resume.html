
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Portfolio</title>
    <link rel="stylesheet" href="resume.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="resume-container">
        <!-- Floating Background Elements -->
        <div class="floating-elements">
            <div class="floating-circle floating-1"></div>
            <div class="floating-circle floating-2"></div>
            <div class="floating-circle floating-3"></div>
        </div>

        <div class="container">
            <div class="max-width-container">
                <!-- Section Header -->
                <div class="section-header animate-fade-in">
                    <h2 class="main-title">
                        <span class="gradient-text">Resume</span>
                    </h2>
                    <div class="title-underline"></div>
                    <p class="section-description">
                        Professional journey and achievements in software development
                    </p>
                    <button class="download-btn hover-scale" id="downloadBtn">
                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7,10 12,15 17,10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Download Resume
                    </button>
                </div>

                <!-- Resume Content -->
                <div class="resume-grid">
                    <!-- Left Column - Experience & Education -->
                    <div class="main-content">
                        <!-- Professional Experience -->
                        <div class="experience-section animate-fade-in" style="animation-delay: 0.3s;">
                            <div class="section-title">
                                <svg class="section-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                    <line x1="8" y1="21" x2="16" y2="21"></line>
                                    <line x1="12" y1="17" x2="12" y2="21"></line>
                                </svg>
                                <h3>Professional Experience</h3>
                            </div>
                            
                            <div class="experience-timeline" id="experienceTimeline">
                                <!-- Experience items will be generated by JavaScript -->
                            </div>
                        </div>

                        <!-- Education -->
                        <div class="education-section animate-fade-in" style="animation-delay: 0.6s;">
                            <div class="section-title">
                                <svg class="section-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                                    <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                                </svg>
                                <h3>Education</h3>
                            </div>
                            
                            <div class="education-grid" id="educationGrid">
                                <!-- Education items will be generated by JavaScript -->
                            </div>
                        </div>
                    </div>

                    <!-- Right Column - Certifications & Stats -->
                    <div class="sidebar-content">
                        <!-- Certifications -->
                        <div class="certifications-section animate-fade-in" style="animation-delay: 0.5s;">
                            <div class="section-title">
                                <svg class="section-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="8" r="7"></circle>
                                    <polyline points="8.21,13.89 7,23 12,20 17,23 15.79,13.88"></polyline>
                                </svg>
                                <h3>Certifications</h3>
                            </div>
                            
                            <div class="certifications-card">
                                <div class="certifications-list" id="certificationsList">
                                    <!-- Certifications will be generated by JavaScript -->
                                </div>
                            </div>
                        </div>

                        <!-- Quick Stats -->
                        <div class="stats-section animate-fade-in" style="animation-delay: 0.7s;">
                            <h3 class="stats-title">Quick Stats</h3>
                            <div class="stats-card">
                                <div class="stats-grid" id="statsGrid">
                                    <!-- Stats will be generated by JavaScript -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="resume.js"></script>
</body>
</html>
